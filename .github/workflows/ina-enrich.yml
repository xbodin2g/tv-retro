name: 🏛️ INA Enrich
run-name: 🏛️ ${{ inputs.program_custom || inputs.program }} · ${{ inputs.year }} · ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "① ACTION — all = moisson | targets = registre (0 req) | report-only = tableau | diagnose | rebuild | index-only | notices-only"
        type: choice
        default: all
        options: [all, targets, report-only, diagnose, rebuild, index-only, notices-only]
      program:
        description: "② ÉMISSION (menu) — ignorée si ③ est rempli"
        type: choice
        default: Club Dorothée
        options:
          - Club Dorothée
          - Récré A2
          - Amuse 3
          - Cabou Cadin
          - Vitamine
          - Youpi ! L'école est finie
          - Les Visiteurs du mercredi
          - Croque-Vacances
          - Le Village dans les nuages
          - Le réveil des babalous
          - Discopuce
          - Giga
          - Ça cartoon
          - Canaille Peluche
          - Décode pas Bunny
          - Le Disney Channel
          - Debout les enfants
          - Samdynamite
          - Télétaz
          - Les Minikeums
          - Disney Parade
          - Disney Club
          - Club Mini
          - À tout Spip
          - TF! Jeunesse
          - Télévisator 2
          - Chalu Maureen
          - Graffi'6
          - M6 Kid
          - Multitop
          - Salut les Musclés
          - Premiers baisers
          - Les années fac
          - Cellulo
      program_custom:
        description: "③ ÉMISSION EXACTE — prioritaire sur le menu"
        type: string
        default: ""
      channel:
        description: "④ CHAÎNE — active la méthode B (ch+tiprog). Vide = chaîne du registre"
        type: choice
        default: ""
        options: ["", "TF1", "Antenne 2", "France 2", "FR3", "France 3", "Canal+", "La Cinq", "M6", "TV6", "La Sept", "Arte", "La Cinquième", "ORTF 1", "ORTF 2", "ORTF 3"]
      strategies:
        description: "⑤ MÉTHODES — both = A ancienne + B canal + C hybride (recommandé)"
        type: choice
        default: both
        options: [both, channel, legacy, hybrid]
      year:
        description: "⑥ ANNÉE — 'toutes' balaye la plage de l'émission"
        type: choice
        default: "1989"
        options: ["1989","1988","1987","1990","1991","1992","1993","1994","1995","1996","1997","1998","1999","1986","1985","1984","1983","1982","1981","1980","1979","1978","1977","1976","1975","1974","1973","1972","1971","1970","toutes"]
      max_notices:
        description: "⑦ NOTICES MAX ce run — 0 = illimité"
        type: choice
        default: "400"
        options: ["400","200","600","1000","0"]
      retry_empty:
        description: "⑧ Retenter celles sans œuvre"
        type: boolean
        default: false
      refresh_stale:
        description: "⑨ Re-télécharger les anciennes versions (rarement utile)"
        type: boolean
        default: false
      origin:
        description: "⑩ ORIGINE — manual | dashboard | diagnostic"
        type: string
        default: manual

concurrency:
  group: ina-enrich
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper
      - name: 🏛️ Moisson
        env:
          M: ${{ github.event.inputs.mode }}
          P: ${{ github.event.inputs.program }}
          C: ${{ github.event.inputs.program_custom }}
          CH: ${{ github.event.inputs.channel }}
          ST: ${{ github.event.inputs.strategies }}
          Y: ${{ github.event.inputs.year }}
          N: ${{ github.event.inputs.max_notices }}
          RE: ${{ github.event.inputs.retry_empty }}
          RS: ${{ github.event.inputs.refresh_stale }}
        run: |
          PROGRAM="$P"; [ -n "$C" ] && PROGRAM="$C"
          case "$M" in
            targets)     ARGS=(--targets-only) ;;
            report-only) ARGS=(--report-only) ;;
            diagnose)    ARGS=(--diagnose --program "$PROGRAM") ;;
            rebuild)     ARGS=(--rebuild --program "$PROGRAM") ;;
            *)
              ARGS=(--program "$PROGRAM" --max-notices "$N" --delay 3.0 --strategies "$ST")
              [ -n "$CH" ] && ARGS+=(--channel "$CH")
              [ "$M" = "index-only" ] && ARGS+=(--index-only)
              [ "$M" = "notices-only" ] && ARGS+=(--notices-only)
              [ "$RE" = "true" ] && ARGS+=(--retry-empty)
              [ "$RS" = "true" ] && ARGS+=(--refresh-stale)
              ;;
          esac
          case "$M" in targets|report-only) ;; *) [ "$Y" != "toutes" ] && ARGS+=(--year "$Y") ;; esac
          printf '%s\n' "─────────────────────────────" "Action : $M" "Émission : $PROGRAM" "Chaîne : ${CH:-registre}" "Méthodes : $ST" "Année : $Y" "Max : $N" "Origine : ${{ github.event.inputs.origin }}" "─────────────────────────────"
          python scraper/ina_catalogue_scraper.py "${ARGS[@]}"
      - name: 💾 Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ina
          git diff --staged --quiet || (git commit -m "chore(ina): ${{ github.event.inputs.mode }} ${{ github.event.inputs.program_custom || github.event.inputs.program }} ${{ github.event.inputs.year }}" && git push)