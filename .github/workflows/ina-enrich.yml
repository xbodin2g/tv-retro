name: 🏛️ INA Enrich

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "① ACTION — all = moisson | report-only = tableau seul (0 requête) | rebuild = re-normalise le cache | index-only | notices-only"
        type: choice
        default: all
        options: [all, report-only, rebuild, index-only, notices-only]
      program:
        description: "② ÉMISSION (ignoré si report-only)"
        type: choice
        default: Club Dorothée
        options:
          - Club Dorothée
          - Récré A2
          - Amuse 3
          - Le réveil des babalous
          - Vitamine
          - Croque-Vacances
          - Le Village dans les nuages
          - Les Visiteurs du mercredi
          - Disney Parade
          - Disney Club
          - Club Mini
          - À tout Spip
          - TF! Jeunesse
          - Discopuce
          - Giga
          - Télévisator 2
          - Chalu Maureen
          - Le Disney Channel
          - Debout les enfants
          - Samdynamite
          - Télétaz
          - Les Minikeums
          - Cabou Cadin
          - Ça cartoon
          - Décode pas Bunny
          - Canaille Peluche
          - Youpi ! L'école est finie
          - Cellulo
          - Graffi'6
          - M6 Kid
          - Multitop
          - Salut les Musclés
          - Premiers baisers
          - Les années fac
      program_custom:
        description: "③ ÉMISSION AUTRE — si rempli, remplace le menu"
        type: string
        default: ""
      year:
        description: "④ ANNÉE — 'toutes' balaye 1970→1999"
        type: choice
        default: "1989"
        options: ["1989","1988","1987","1990","1991","1992","1993","1994","1995","1996","1997","1998","1999","1986","1985","1984","1983","1982","1981","1980","1979","1978","1977","1976","1975","1974","1973","1972","1971","1970","toutes"]
      max_notices:
        description: "⑤ NOTICES MAX ce run — 0 = illimité"
        type: choice
        default: "400"
        options: ["400","200","600","1000","0"]
      retry_empty:
        description: "⑥ Retenter les notices déjà en cache mais sans œuvre"
        type: boolean
        default: false
      force:
        description: "⑦ Tout re-télécharger (ignore le cache)"
        type: boolean
        default: false

concurrency: {group: ina-enrich, cancel-in-progress: false}
permissions: {contents: write}

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper
      - name: 🏛️ Moisson
        env:
          M: ${{ github.event.inputs.mode }}
          P: ${{ github.event.inputs.program }}
          C: ${{ github.event.inputs.program_custom }}
          Y: ${{ github.event.inputs.year }}
          N: ${{ github.event.inputs.max_notices }}
          RE: ${{ github.event.inputs.retry_empty }}
          F: ${{ github.event.inputs.force }}
        run: |
          PROGRAM="$P"; [ -n "$C" ] && PROGRAM="$C"
          ARGS=(--delay 3.0)
          case "$M" in
            report-only) ARGS=(--report-only) ;;
            rebuild)     ARGS+=(--rebuild --program "$PROGRAM") ;;
            *)
              ARGS+=(--program "$PROGRAM" --max-notices "$N")
              [ "$Y" != "toutes" ] && ARGS+=(--year "$Y")
              [ "$M" = "index-only" ] && ARGS+=(--index-only)
              [ "$M" = "notices-only" ] && ARGS+=(--notices-only)
              [ "$RE" = "true" ] && ARGS+=(--retry-empty)
              [ "$F" = "true" ] && ARGS+=(--force)
              ;;
          esac
          printf '%s\n' "─────────────────────────────" "Action : $M" "Émission : $PROGRAM" "Année : $Y" "Max : $N" "─────────────────────────────"
          python scraper/ina_catalogue_scraper.py "${ARGS[@]}"
      - name: 💾 Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ina
          git diff --staged --quiet || (git commit -m "chore(ina): ${{ github.event.inputs.mode }} ${{ github.event.inputs.program }} ${{ github.event.inputs.year }}" && git push)