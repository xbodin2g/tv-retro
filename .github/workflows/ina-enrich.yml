name: 🏛️ INA Enrich

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "① ACTION — all = moisson | diagnose = état du cache (0 req) | report-only = tableau | rebuild = re-normalise | index-only | notices-only"
        type: choice
        default: all
        options: [all, diagnose, report-only, rebuild, index-only, notices-only]
      program:
        description: "② ÉMISSION"
        type: choice
        default: Club Dorothée
        options:
          - Club Dorothée
          - Récré A2
          - Amuse 3
          - Le réveil des babalous
          - Vitamine
          - Croque-Vacances
          - Le Village dans les nuages
          - Les Visiteurs du mercredi
          - Disney Parade
          - Disney Club
          - Club Mini
          - À tout Spip
          - TF! Jeunesse
          - Discopuce
          - Giga
          - Télévisator 2
          - Chalu Maureen
          - Le Disney Channel
          - Debout les enfants
          - Samdynamite
          - Télétaz
          - Les Minikeums
          - Cabou Cadin
          - Ça cartoon
          - Décode pas Bunny
          - Canaille Peluche
          - Youpi ! L'école est finie
          - Cellulo
          - Graffi'6
          - M6 Kid
          - Multitop
          - Salut les Musclés
          - Premiers baisers
          - Les années fac
      program_custom: {description: "③ ÉMISSION AUTRE — remplace le menu si rempli", type: string, default: ""}
      year:
        description: "④ ANNÉE — 'toutes' balaye 1970→1999"
        type: choice
        default: "1989"
        options: ["1989","1988","1987","1990","1991","1992","1993","1994","1995","1996","1997","1998","1999","1986","1985","1984","1983","1982","1981","1980","1979","1978","1977","1976","1975","1974","1973","1972","1971","1970","toutes"]
      max_notices: {description: "⑤ NOTICES MAX ce run — 0 = illimité", type: choice, default: "400", options: ["400","200","600","1000","0"]}
      retry_empty: {description: "⑥ Retenter celles sans œuvre", type: boolean, default: false}
      refresh_stale: {description: "⑦ Re-télécharger les anciennes versions (rarement utile)", type: boolean, default: false}

concurrency: {group: ina-enrich, cancel-in-progress: false}
permissions: {contents: write}

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper
      - name: 🏛️ Moisson
        env:
          M: ${{ github.event.inputs.mode }}
          P: ${{ github.event.inputs.program }}
          C: ${{ github.event.inputs.program_custom }}
          Y: ${{ github.event.inputs.year }}
          N: ${{ github.event.inputs.max_notices }}
          RE: ${{ github.event.inputs.retry_empty }}
          RS: ${{ github.event.inputs.refresh_stale }}
        run: |
          PROGRAM="$P"; [ -n "$C" ] && PROGRAM="$C"
          case "$M" in
            report-only) ARGS=(--report-only) ;;
            diagnose)    ARGS=(--diagnose --program "$PROGRAM") ;;
            rebuild)     ARGS=(--rebuild --program "$PROGRAM") ;;
            *)
              ARGS=(--program "$PROGRAM" --max-notices "$N" --delay 3.0)
              [ "$M" = "index-only" ] && ARGS+=(--index-only)
              [ "$M" = "notices-only" ] && ARGS+=(--notices-only)
              [ "$RE" = "true" ] && ARGS+=(--retry-empty)
              [ "$RS" = "true" ] && ARGS+=(--refresh-stale)
              ;;
          esac
          if [ "$M" != "report-only" ] && [ "$Y" != "toutes" ]; then ARGS+=(--year "$Y"); fi
          printf '%s\n' "─────────────────────────────" "Action : $M" "Émission : $PROGRAM" "Année : $Y" "Max : $N" "─────────────────────────────"
          python scraper/ina_catalogue_scraper.py "${ARGS[@]}"
      - name: 💾 Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ina
          git diff --staged --quiet || (git commit -m "chore(ina): ${{ github.event.inputs.mode }} ${{ github.event.inputs.program }} ${{ github.event.inputs.year }}" && git push)