name: 🐛 Debug Scraper

on:
  workflow_dispatch:
    inputs:
      custom_url:
        description: 'URL personnalisée à analyser (optionnel)'
        required: false
        type: string

# 🔑 PERMISSIONS EXPLICITES - CRUCIAL !
permissions:
  contents: write
  actions: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Debug des structures HTML
    
    steps:
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important pour le push
      
      - name: 🐍 Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml cloudscraper
          echo "✅ Dépendances installées"
      
      - name: 🔍 Test de diagnostic Git
        run: |
          echo "=== DIAGNOSTIC GIT ==="
          echo "Branche actuelle: $(git branch --show-current)"
          echo "Utilisateur git:"
          git config --get user.name || echo "(non configuré)"
          echo "Remote:"
          git remote -v
          echo "Status avant:"
          git status
          echo "====================="
      
      - name: 📂 Création du dossier debug
        run: |
          mkdir -p debug
          echo "Test de création - $(date)" > debug/test.txt
          echo "✅ Dossier debug créé"
          ls -la debug/
      
      - name: 🐛 Lancement du debug complet
        run: |
          python debug_scraper.py
      
      - name: 🔍 Analyse URL personnalisée
        if: github.event.inputs.custom_url != ''
        env:
          CUSTOM_URL: ${{ github.event.inputs.custom_url }}
        run: |
          echo "🔍 Analyse de l'URL personnalisée: $CUSTOM_URL"
          python -c "
          import cloudscraper
          from bs4 import BeautifulSoup
          import os
          import time
          import random
          
          url = '$CUSTOM_URL'
          print(f'Analyse de: {url}')
          
          scraper = cloudscraper.create_scraper(browser={'browser': 'chrome', 'platform': 'windows', 'desktop': True})
          scraper.headers.update({
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8',
              'Accept-Language': 'fr-FR,fr;q=0.9',
          })
          
          time.sleep(random.uniform(2.0, 4.0))
          response = scraper.get(url, timeout=30)
          
          print(f'Status: {response.status_code}')
          
          os.makedirs('debug', exist_ok=True)
          
          with open('debug/custom_page.html', 'w', encoding='utf-8') as f:
              f.write(response.text)
          
          soup = BeautifulSoup(response.text, 'html.parser')
          
          with open('debug/custom_page.txt', 'w', encoding='utf-8') as f:
              f.write(f'URL: {url}\n')
              f.write(f'Status: {response.status_code}\n')
              f.write('='*80 + '\n\n')
              f.write(soup.get_text('\n', strip=True))
          
          print('✓ Fichiers créés: debug/custom_page.html et debug/custom_page.txt')
          "
      
      - name: 📊 Liste des fichiers créés
        run: |
          echo "=== FICHIERS DANS LE DÉPÔT ==="
          find . -type f -not -path '*/\.git/*' | head -50
          echo ""
          echo "=== FICHIERS DANS DEBUG/ ==="
          find debug -type f 2>/dev/null | sort || echo "Dossier debug vide ou inexistant"
      
      - name: 💾 Configuration Git et Commit
        run: |
          echo "=== CONFIGURATION GIT ==="
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          echo "=== STATUS AVANT ADD ==="
          git status
          
          echo "=== AJOUT DES FICHIERS ==="
          git add debug/
          git add -A
          
          echo "=== STATUS APRÈS ADD ==="
          git status
          
          echo "=== VÉRIFICATION DES CHANGEMENTS ==="
          if git diff --staged --quiet; then
            echo "⚠️  Aucun changement détecté dans le staging"
            # Essayer de forcer
            git add --force debug/
            git status
          fi
      
      - name: 📤 Push des changements
        run: |
          if git diff --staged --quiet; then
            echo "ℹ️  Aucun changement à committer"
          else
            echo "=== COMMIT ==="
            git commit -m "🐛 Debug files - $(date +'%Y-%m-%d %H:%M:%S')"
            echo "=== PUSH ==="
            BRANCH=$(git branch --show-current)
            echo "Push vers la branche: $BRANCH"
            git push origin $BRANCH
            echo "✅ Push réussi"
          fi
      
      - name: 📋 Résumé final
        if: always()
        run: |
          echo "==================================================="
          echo "🎯 RÉSUMÉ DU WORKFLOW"
          echo "==================================================="
          echo "Statut final: ${{ job.status }}"
          echo "Branche: $(git branch --show-current)"
          echo "==================================================="
          echo ""
          echo "📂 Fichiers dans debug/ :"
          find debug -type f 2>/dev/null | sort || echo "(aucun)"
          echo ""
          echo "🔗 Lien vers le dépôt:"
          echo "   https://github.com/${{ github.repository }}/tree/main/debug"
          echo ""
          echo "⚠️  SI LE DOSSIER DEBUG N'APPARAÎT PAS :"
          echo "   1. Vérifiez que vous êtes sur la bonne branche"
          echo "   2. Regardez les logs ci-dessus pour les erreurs"
          echo "   3. Vérifiez les permissions du workflow"